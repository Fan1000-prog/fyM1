[project]
name = "fym1"
version = "0.1.0"
description = "fy-m1: tooling to build, evaluate and publish an everyday-Malagasy chat model"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.25",
    "datasets>=3.0",
    "ftfy>=6.2",
    "fasttext-numpy2-wheel>=0.9.2",
    "sacrebleu>=2.4",
    "numpy>=1.26",
]

[dependency-groups]
data = [
    "wordfreq>=3.1",
]
dev = [
    "pytest>=8",
    "nbformat>=5.10",
    "jinja2>=3.1",
]
# Vocabulary trimming (src/fym1/shrink). Kept out of `dev` so other work does not pull torch.
shrink = [
    "torch>=2.4",
    "transformers>=4.46",
    "tokenizers>=0.20",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "protobuf>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fym1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only torch on Linux (CI); macOS wheels from PyPI are CPU already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
