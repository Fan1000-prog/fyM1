[project]
name = "fym1"
version = "0.1.0"
description = "fyM1: tooling to build, evaluate and publish an everyday-Malagasy chat model"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.25",
    "datasets>=3.0",
    "ftfy>=6.2",
    "fasttext-numpy2-wheel>=0.9.2",
    "sacrebleu>=2.4",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "nbformat>=5.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fym1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
